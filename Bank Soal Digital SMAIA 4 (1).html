<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bank Soal Digital SMAIA 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAFA;--dot:#cbd5e1;--card:#fff;--ink:#0F172A;--blue:#2563EB;--yellow:#FACC15;--muted:#475569;--sh:#0F172A;--red:#DC2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F172A;--dot:#334155;--card:#1E293B;--ink:#F1F5F9;--blue:#3B82F6;--yellow:#FDE047;--muted:#94A3B8;--sh:#000;--red:#F87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F172A;--dot:#334155;--card:#1E293B;--ink:#F1F5F9;--blue:#3B82F6;--yellow:#FDE047;--muted:#94A3B8;--sh:#000;--red:#F87171;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:20px 20px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
.btn,.card,.chip,input,select,.box{border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--sh)}
.btn,.chip{font:600 1rem Inter,sans-serif;color:var(--ink);background:var(--card);padding:10px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s}
.btn:hover,.chip:hover,.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sh)}
.btn:active,.chip:active,.card:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--sh)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.btn.primary,.chip.on{background:var(--blue);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.disabled,.btn:disabled{opacity:.45;pointer-events:none}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.logo{background:var(--yellow);color:#0F172A;border:2.5px solid var(--ink);border-radius:10px;padding:2px 9px;box-shadow:3px 3px 0 var(--sh)}
.hero{padding:34px 0 26px}
.badge{display:inline-block;background:var(--yellow);color:#0F172A;border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:600;font-size:.85rem;box-shadow:3px 3px 0 var(--sh)}
h1{font-size:clamp(2.2rem,6.5vw,4.2rem);line-height:1.02;margin:18px 0 14px;letter-spacing:-.02em}
h1 span{background:var(--blue);color:#fff;padding:0 12px;border:2.5px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--sh);display:inline-block;transform:rotate(-1.5deg)}
.hero p{max-width:560px;color:var(--muted);font-size:1.05rem;line-height:1.6;margin:0}
.tools{display:flex;flex-direction:column;gap:14px;margin:10px 0 22px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input,select{width:100%;background:var(--card);color:var(--ink);padding:12px 16px;min-height:50px;font:500 16px Inter,sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px;padding:6px 6px 40px}
.card{background:var(--card);padding:18px;display:flex;flex-direction:column;gap:10px;transition:transform .12s,box-shadow .12s}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kelas{background:var(--yellow);color:#0F172A;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font:700 .85rem 'Space Grotesk'}
.mapel{font-weight:600;color:var(--blue);font-size:.9rem}
.card h3{font-size:1.12rem;line-height:1.3}
.meta{color:var(--muted);font-size:.85rem}
.acts{display:flex;gap:10px;margin-top:auto;flex-wrap:wrap}
.empty{grid-column:1/-1;text-align:center;padding:40px 10px;color:var(--muted)}
footer{border-top:2.5px solid var(--ink);padding:22px 0 30px;font-size:.9rem;color:var(--muted)}
/* ADMIN */
#admin{position:fixed;inset:0;z-index:30;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:20px 20px;overflow:auto;display:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#admin.open{display:block}
.box{background:var(--card);padding:22px;margin:18px 0}
.box h2{margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-weight:600}
.field small{font-weight:400;color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 0;border-top:2px dashed var(--dot)}
.item b{display:block}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--red);color:#fff}
#loader{position:fixed;top:0;left:0;right:0;height:5px;background:var(--yellow);z-index:60;display:none;animation:ld 1s infinite alternate}
#loader.on{display:block}
@keyframes ld{from{opacity:.3}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="loader"></div><div id="toast" role="status"></div>

<div class="wrap">
<nav>
  <div class="brand"><span class="logo">SMAIA 4</span> Bank Soal</div>
  <button class="btn" id="themeBtn" aria-label="Ganti tema">🌙 Dark</button>
</nav>
<header class="hero">
  <span class="badge">Persiapan PTS, PAS, Sumatif</span>
  <h1>Bank Soal<br>Digital <span>SMAIA 4</span></h1>
  <p>Pilih kelas, cari mapel, langsung latihan. Dari OSIS untuk kalian.</p>
</header>
<section class="tools">
  <div class="row" id="kelasTabs"></div>
  <div class="row" id="mapelTabs"></div>
  <input id="q" type="search" placeholder="Cari judul soal atau mapel..." aria-label="Cari soal">
</section>
<main class="grid" id="grid"></main>
<footer style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span>© OSIS SMAIA 4</span><button class="btn" id="lockBtn" aria-label="Masuk admin" style="min-width:44px;padding:6px 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="11" width="15" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button></footer>
</div>

<!-- ADMIN (tersembunyi, hanya muncul lewat URL rahasia) -->
<div id="admin"><div class="wrap">
  <nav><div class="brand"><span class="logo">PJ</span> Kelola Soal</div><button class="btn" id="outBtn">Keluar</button></nav>
  <div class="box" id="loginBox">
    <h2>Masuk</h2>
    <label class="field">PIN<input id="pin" type="password" inputmode="numeric" autocomplete="current-password"></label>
    <button class="btn primary" id="loginBtn">Masuk</button>
  </div>
  <div id="panel" style="display:none">
    <div class="box">
      <h2 id="formTitle">Tambah Soal</h2>
      <label class="field">Judul File<input id="fJudul" autocomplete="off"></label>
      <div class="field">Kelas<div class="row"><button class="chip on" data-k="10" type="button">Kelas 10</button><button class="chip" data-k="11" type="button">Kelas 11</button></div></div>
      <label class="field">Kategori<input id="fMapel" list="mapelList" placeholder="Contoh: Ekonomi" autocomplete="off"><datalist id="mapelList"></datalist></label>
      <label class="field">Paste Link Google Drive<input id="fLink" type="url" placeholder="Tempel hasil Copy Link"></label>
      <label class="field">Link Pembahasan <small>(boleh kosong)</small><input id="fBahas" type="url"></label>
      <div class="row"><button class="btn primary" id="saveBtn">Simpan</button><button class="btn" id="cancelBtn" style="display:none">Batal edit</button></div>
    </div>
    <div class="box"><h2>Daftar Soal</h2><div id="adminList"></div></div>
  </div>
</div></div>

<script>
// === PENGATURAN (diisi sekali oleh pembuat website) ===
const API_URL = "https://script.google.com/macros/s/AKfycbxELO1yfSxO3Uv0eSrRaPDCzjVr01fUKYwxJ8nZhHMhHlNFw48N7TXguQt0LKpoXcPT/exec"; // Tempel URL Web App dari Google Apps Script di sini
const ADMIN_HASH = "#akses-pj"; // Alamat rahasia: tambahkan ini di akhir URL website
// =====================================================

const DEMO = [
  {id:"d1",kelas:"10",mapel:"Ekonomi",judul:"Latihan Sumatif - Kelangkaan & Biaya Peluang",linkSoal:"https://drive.google.com/file/d/1AbCdEfGhIjKlMnOpQrStUvWxYz123456/view",linkPembahasan:""},
  {id:"d2",kelas:"11",mapel:"Biologi",judul:"Latihan PTS - Sistem Peredaran Darah",linkSoal:"https://drive.google.com/drive/folders/1AbCdEfGhIjKlMnOpQrStUvWxYz123456",linkPembahasan:""}
];
let DATA = [], state = {kelas:"Semua",mapel:"Semua",q:""}, editId = null, fKelas = "10";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ss = { get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}}, del:k=>{try{sessionStorage.removeItem(k)}catch(e){}} };

/* Link Drive: ambil ID otomatis, rapikan jadi link valid */
function normLink(u){
  u = (u||"").trim(); if(!u) return "";
  let m;
  if((m=u.match(/\/folders\/([\w-]{10,})/))) return "https://drive.google.com/drive/folders/"+m[1];
  if((m=u.match(/\/file\/d\/([\w-]{10,})/))) return "https://drive.google.com/file/d/"+m[1]+"/view";
  if((m=u.match(/drive\.google\.com\/(?:open|uc)\?(?:.*&)?id=([\w-]{10,})/))) return "https://drive.google.com/file/d/"+m[1]+"/view";
  if(/^https:\/\/(docs\.google\.com|forms\.gle|forms\.google\.com)\//.test(u)) return u.split("?usp=")[0];
  return null;
}
function tipe(u){
  if(/\/folders\//.test(u)) return "Folder Drive";
  if(/drive\.google\.com\/file/.test(u)) return "File Drive";
  if(/forms/.test(u)) return "Google Form";
  return "Google Docs";
}

/* Komunikasi dengan Google Apps Script */
function busy(on){ $("loader").classList.toggle("on",on); document.querySelectorAll("#admin .btn").forEach(b=>b.disabled=on); }
let tt; function toast(msg,err){ const t=$("toast"); t.textContent=msg; t.className="show"+(err?" err":""); clearTimeout(tt); tt=setTimeout(()=>t.className="",2800); }
async function api(body){
  const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return r.json();
}
async function loadData(){
  if(!API_URL){ DATA = DEMO; return render(); }
  try{ const r = await (await fetch(API_URL)).json(); DATA = r.data||[]; }
  catch(e){ DATA = []; toast("Gagal memuat soal. Cek koneksi.",true); }
  render();
}

/* Halaman utama */
function chips(el,items,key){
  el.innerHTML="";
  items.forEach(v=>{ const b=document.createElement("button"); b.className="chip"+(state[key]===v?" on":"");
    b.textContent = key==="kelas"&&v!=="Semua" ? "Kelas "+v : v; b.onclick=()=>{state[key]=v;render()}; el.appendChild(b); });
}
function render(){
  chips($("kelasTabs"),["Semua","10","11"],"kelas");
  chips($("mapelTabs"),["Semua",...new Set(DATA.map(d=>d.mapel))],"mapel");
  const q=state.q.toLowerCase();
  const list=DATA.filter(d=>(state.kelas==="Semua"||d.kelas===state.kelas)&&(state.mapel==="Semua"||d.mapel===state.mapel)&&(!q||(d.judul+" "+d.mapel).toLowerCase().includes(q)));
  $("grid").innerHTML = list.length ? list.map(d=>{
    const s=normLink(d.linkSoal), p=normLink(d.linkPembahasan);
    return `<article class="card"><div class="top"><span class="kelas">Kelas ${esc(d.kelas)}</span><span class="mapel">${esc(d.mapel)}</span></div>
    <h3>${esc(d.judul)}</h3><div class="meta">${s?tipe(s):""}</div>
    <div class="acts"><a class="btn primary ${s?"":"disabled"}" href="${esc(s||"#")}" target="_blank" rel="noopener">Buka Soal</a>
    <a class="btn ${p?"":"disabled"}" href="${esc(p||"#")}" target="_blank" rel="noopener">Pembahasan</a></div></article>`;
  }).join("") : `<div class="empty"><b>Soal belum ketemu.</b><br>Coba kata kunci lain atau pilih "Semua".</div>`;
  renderAdminList();
}
$("q").addEventListener("input",e=>{state.q=e.target.value;render()});

/* Tema */
function isDark(){ const t=document.documentElement.getAttribute("data-theme"); return t? t==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function setTheme(t){ document.documentElement.setAttribute("data-theme",t); $("themeBtn").textContent = t==="dark"?"☀️ Light":"🌙 Dark"; try{localStorage.setItem("tema-bank-soal",t)}catch(e){} }
let sv=null; try{sv=localStorage.getItem("tema-bank-soal")}catch(e){}
if(sv) document.documentElement.setAttribute("data-theme",sv);
$("themeBtn").textContent = isDark()?"☀️ Light":"🌙 Dark";
$("themeBtn").onclick=()=>setTheme(isDark()?"light":"dark");

/* Admin */
const wantsAdmin = () => location.hash===ADMIN_HASH || new URLSearchParams(location.search).has("admin");
function showAdmin(){
  $("admin").classList.add("open");
  const logged = !!ss.get("pjToken");
  $("loginBox").style.display = logged?"none":"block";
  $("panel").style.display = logged?"block":"none";
  if(!logged) setTimeout(()=>$("pin").focus(),50);
}
function hideAdmin(){ $("admin").classList.remove("open"); }
function logout(){ ss.del("pjToken"); hideAdmin(); history.replaceState(null,"",location.pathname); }
$("outBtn").onclick=logout;
$("lockBtn").onclick=showAdmin;
window.addEventListener("hashchange",()=>{ wantsAdmin()?showAdmin():hideAdmin(); });

$("loginBtn").onclick=async()=>{
  if(!API_URL) return toast("Alamat Apps Script belum diisi.",true);
  const pin=$("pin").value.trim(); if(!pin) return toast("Isi PIN dulu.",true);
  busy(true);
  try{ const r=await api({action:"login",pin});
    if(r.ok){ ss.set("pjToken",r.token); $("pin").value=""; toast("Berhasil masuk"); showAdmin(); }
    else toast(r.error||"PIN salah",true);
  }catch(e){ toast("Gagal terhubung. Coba lagi.",true); }
  busy(false);
};
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") $("loginBtn").click(); });

document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>setKelas(b.dataset.k));
function setKelas(k){ fKelas=k; document.querySelectorAll("[data-k]").forEach(b=>b.classList.toggle("on",b.dataset.k===k)); }
function resetForm(){ editId=null; ["fJudul","fMapel","fLink","fBahas"].forEach(i=>$(i).value=""); setKelas("10"); $("formTitle").textContent="Tambah Soal"; $("cancelBtn").style.display="none"; }
$("cancelBtn").onclick=resetForm;

function renderAdminList(){
  $("mapelList").innerHTML=[...new Set(DATA.map(d=>d.mapel))].map(m=>`<option value="${esc(m)}">`).join("");
  $("adminList").innerHTML = DATA.length ? DATA.map(d=>`<div class="item"><div><b>${esc(d.judul)}</b><span class="meta">Kelas ${esc(d.kelas)} · ${esc(d.mapel)}</span></div>
    <div class="row"><button class="btn" data-edit="${esc(d.id)}">Ubah</button><button class="btn danger" data-del="${esc(d.id)}">Hapus</button></div></div>`).join("") : "<p class='meta'>Belum ada soal.</p>";
}
$("adminList").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"), dl=e.target.closest("[data-del]");
  if(ed){ const d=DATA.find(x=>x.id===ed.dataset.edit); if(!d) return;
    editId=d.id; $("fJudul").value=d.judul; $("fMapel").value=d.mapel; $("fLink").value=d.linkSoal; $("fBahas").value=d.linkPembahasan||""; setKelas(d.kelas);
    $("formTitle").textContent="Ubah Soal"; $("cancelBtn").style.display="inline-flex"; $("admin").scrollTo({top:0,behavior:"smooth"}); }
  if(dl){ const d=DATA.find(x=>x.id===dl.dataset.del); if(d && confirm("Hapus soal ini?\n"+d.judul)) send({action:"delete",id:d.id},"Berhasil dihapus!"); }
});
$("saveBtn").onclick=()=>{
  const judul=$("fJudul").value.trim(), mapel=$("fMapel").value.trim(), link=normLink($("fLink").value), bahasRaw=$("fBahas").value.trim(), bahas=normLink(bahasRaw);
  if(!judul||!mapel) return toast("Judul dan Kategori wajib diisi.",true);
  if(!link) return toast("Link Drive tidak dikenali. Pakai Copy Link dari Google Drive.",true);
  if(bahasRaw && !bahas) return toast("Link pembahasan tidak dikenali.",true);
  send({action:"save",item:{id:editId||"",kelas:fKelas,mapel,judul,linkSoal:link,linkPembahasan:bahas}},"Berhasil disimpan!");
};
async function send(body,okMsg){
  if(!API_URL) return toast("Alamat Apps Script belum diisi.",true);
  busy(true);
  try{ const r=await api({...body,token:ss.get("pjToken")});
    if(r.ok){ toast(okMsg); resetForm(); await loadData(); }
    else { toast(r.error||"Gagal",true); if(/sesi/i.test(r.error||"")){ ss.del("pjToken"); showAdmin(); } }
  }catch(e){ toast("Gagal terhubung. Coba lagi.",true); }
  busy(false);
}

loadData();
if(wantsAdmin()) showAdmin();
</script>
</body>
</html>
